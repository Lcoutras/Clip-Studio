<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Clip Studio</div>
  <form id="folder-form" class="folder">
    <input id="folder" placeholder="Folder with your recordings, e.g. C:\Users\you\Videos\Rocket League" spellcheck="false">
    <button type="submit">Open</button>
  </form>
</header>

<div class="layout">
  <aside class="sidebar">
    <h2>Recordings</h2>
    <ul id="videos" class="videos"></ul>
    <div id="jobs" class="jobs"></div>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <h1>Pick a recording</h1>
      <p>Open your recordings folder above, then choose a recording on the left and click <b>Scan</b>.
        Each play it finds shows up here with extra footage on both sides, so you can trim it,
        change the caption and music, or discard it before rendering.</p>
    </div>

    <section id="workspace" hidden>
      <div class="toolbar">
        <div>
          <h1 id="title"></h1>
          <div id="summary" class="muted"></div>
        </div>
        <div class="toolbar-actions">
          <div class="segmented" id="filter">
            <button data-filter="all" class="active">All</button>
            <button data-filter="kept">Kept</button>
            <button data-filter="discarded">Discarded</button>
          </div>
          <button id="render-all" class="primary">Render kept clips</button>
        </div>
      </div>
      <div id="clips" class="clips"></div>
    </section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <video id="modal-video" controls playsinline></video>
    <div class="muted" id="modal-caption"></div>
  </div>
</div>

<template id="clip-template">
  <article class="card">
    <div class="card-head">
      <div><span class="num"></span> <span class="label"></span></div>
      <div class="badges"><span class="score"></span><span class="length"></span></div>
    </div>
    <div class="player">
      <video preload="metadata" playsinline></video>
      <div class="loading">Making preview...</div>
    </div>
    <div class="trim">
      <div class="track">
        <div class="range"></div>
        <div class="anchor" title="The play"></div>
        <div class="playhead"></div>
        <div class="handle start" title="Drag to change the start"></div>
        <div class="handle end" title="Drag to change the end"></div>
      </div>
      <div class="trim-row">
        <div class="nudge">
          <button data-act="start-" title="Start 0.5s earlier">&minus;</button>
          <span class="t-start"></span>
          <button data-act="start+" title="Start 0.5s later">+</button>
        </div>
        <button data-act="play" class="play">&#9654; Play clip</button>
        <div class="nudge">
          <button data-act="end-" title="End 0.5s earlier">&minus;</button>
          <span class="t-end"></span>
          <button data-act="end+" title="End 0.5s later">+</button>
        </div>
      </div>
      <div class="trim-row small">
        <button data-act="set-start">Start here</button>
        <span class="muted hint">Pause the video at a moment, then set start or end</span>
        <button data-act="set-end">End here</button>
      </div>
    </div>
    <label class="field">Caption
      <div class="caption-row">
        <textarea rows="2" class="caption"></textarea>
        <button data-act="shuffle" title="Another caption from the library">&#127922;</button>
      </div>
    </label>
    <label class="field">Music
      <select class="music"></select>
    </label>
    <div class="card-actions">
      <button data-act="toggle" class="keep"></button>
      <button data-act="render" class="primary">Render</button>
      <button data-act="view" class="view" hidden>&#9654; Watch final</button>
    </div>
  </article>
</template>

<script src="/static/app.js"></script>
</body>
</html>
